services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-kkhs-bog}
      DB_USERNAME: ${DB_USERNAME:-kkhs_bog_user}
      DB_PASSWORD: ${DB_PASSWORD:-kkhs_bog_password}
      COMPOSER_HOME: /var/www/html/.composer
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -lc "set -e;
      if [ ! -f vendor/autoload.php ]; then
      echo 'Missing PHP dependencies. Run: docker compose run --rm app composer install';
      exit 1;
      fi;
      if ! grep -q '^APP_KEY=base64:' .env 2>/dev/null; then
      php artisan key:generate --force;
      fi;
      php artisan storage:link || true;
      php artisan migrate --force;
      php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-kkhs-bog}
      DB_USERNAME: ${DB_USERNAME:-kkhs_bog_user}
      DB_PASSWORD: ${DB_PASSWORD:-kkhs_bog_password}
      COMPOSER_HOME: /var/www/html/.composer
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -lc "set -e;
      if [ ! -f vendor/autoload.php ]; then
      echo 'Missing PHP dependencies. Run: docker compose run --rm app composer install';
      exit 1;
      fi;
      until grep -q '^APP_KEY=base64:' .env 2>/dev/null; do
      echo 'Waiting for app initialization...';
      sleep 2;
      done;
      php artisan queue:listen --tries=1"

  vite:
    image: node:20-bookworm-slim
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      VITE_PORT: "5173"
      VITE_HMR_HOST: localhost
      npm_config_cache: /var/www/html/.npm-cache
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -lc "set -e;
      if [ ! -d node_modules ]; then
      echo 'Missing Node dependencies. Run: docker compose run --rm vite npm install';
      exit 1;
      fi;
      npm run build;
      npm run dev -- --host 0.0.0.0 --port 5173"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kkhs-bog}
      MYSQL_USER: ${DB_USERNAME:-kkhs_bog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kkhs_bog_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
  node-modules:
